[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchange"
dynamic = ["version"]
description = "A Unified Change Representation Learning Benchmark Library"
readme = "README.md"
# torchange/data/bright.py uses enum.StrEnum, and torchange/__init__.py imports
# every module under data/ eagerly, so `import torchange` needs >= 3.11.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Zhuo Zheng", email = "zhuozheng@cs.stanford.edu" }
]

keywords = [
    "Remote Sensing",
    "Earth Vision",
    "Change Detection",
    "Change Generation",
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Utilities',
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    'numpy',
    'albumentations>=2.0.0',
    'tifffile',
    'scikit-image',
    'tqdm',
    'einops',
    'timm',
    'datasets',
    # 0.6.0 is unimportable (its ever/trainer/__init__.py imports a module that
    # is not shipped), and 0.5.x lacks the ERModule __init_subclass__ auto-config
    # that torchange/module/farseg.py relies on.
    'ever-beta>=0.6.1',
    # imported at package import time via torchange/module/{tv_swin,farseg}.py
    'torch',
    'torchvision',
]

[project.optional-dependencies]
# torchange/models/ is not auto-imported, so these are only needed by the
# individual algorithm files that import them.
hub = ['fire', 'huggingface-hub']              # torchange.utils.push_to_hub
changesparse = ['segmentation-models-pytorch'] # torchange.models.changesparse
neds = ['diffusers']                           # torchange.models.neds
viz = ['matplotlib']                           # torchange.models.segment_any_change.viz

[dependency-groups]
# `uv sync` installs this by default — enough to run the whole test suite.
dev = [
    'pytest>=8',
    'segmentation-models-pytorch',  # tests/models/test_changesparse.py
]

[tool.setuptools.dynamic]
version = { attr = "torchange.__version__" }


[tool.setuptools.packages.find]
exclude = ["projects", "examples", "demo_images", "docs"]
